# Each merge to main with pending changesets is a release: a bot commit bumps the
# version and writes CHANGELOG.md and .clutch/TRACKER.md, then the job tags
# vX.Y.Z and publishes the GitHub release with the clutch binaries. A merge with
# no changeset only regenerates the tracker. Pull requests never commit the
# tracker, so they never conflict on it. See docs/contributing/setup/releases.md.
name: Release

on:
  push:
    branches: [main]

# Least privilege. The release job grants itself write access to contents.
permissions:
  contents: read

# One release at a time, in merge order. A queued run picks up the latest main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    # The bot's key lives in the release environment, which only main may
    # deploy to. See docs/contributing/setup/releases.md#the-release-bot.
    environment: release
    permissions:
      contents: write
    steps:
      # A protected main takes the release push only from a bot on the ruleset's
      # bypass list. The default token cannot be on that list, so the release uses
      # a GitHub App token when the repository has one. Without the app, it uses
      # the default token, which works only while main is unprotected. See
      # docs/contributing/setup/releases.md#the-release-bot.
      - name: Get the release bot token
        id: bot
        if: vars.CLUTCH_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Only the push to main and the tag. The app has more permissions.
          permission-contents: write
      # The latest main, not the pushed commit, so an earlier release commit is included.
      # The checkout keeps no token, so the install, the version script and the
      # build never see one. The push step passes the token itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # Without scripts, so the repository's git hooks stay off. The merge already
      # passed CI, and the release commit only touches the version and the changelog.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Version and changelog
        id: release
        run: bun tools/release/release.ts "$RUNNER_TEMP/release-notes.md"
      # The tracker comes from the issue files on main. In a project, tools/clutch.ts
      # runs the clutch binary that mise installs.
      - name: Regenerate the tracker
        run: |
          if [ -d .clutch/issues ]; then
            bun tools/clutch.ts issues --write
          fi
      # Before the tag, so a failed build publishes no release. Only Clutch has the CLI
      # source; a project's release has no binaries. See tools/release/binaries.ts.
      - name: Build the clutch binaries
        if: steps.release.outputs.released == 'true' && hashFiles('apps/cli/src/main.ts') != ''
        run: bun tools/release/binaries.ts "$RUNNER_TEMP/dist"
      - name: Commit, tag and publish the release
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUSH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node_modules/.bin/oxfmt CHANGELOG.md package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all CHANGELOG.md package.json .changeset
          [ -f .clutch/TRACKER.md ] && git add .clutch/TRACKER.md
          git commit --message "chore(release): v$VERSION"
          git tag "v$VERSION"
          # Atomic, so a refused push to main leaves no orphan tag either.
          git push --atomic "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main "v$VERSION"
          shopt -s nullglob
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP"/dist/*.tar.gz
      # A merge with no changeset makes no release, but its issue changes still
      # reach the tracker.
      - name: Commit the tracker
        if: steps.release.outputs.released != 'true'
        env:
          PUSH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
        run: |
          if [ ! -f .clutch/TRACKER.md ] || git diff --quiet -- .clutch/TRACKER.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .clutch/TRACKER.md
          git commit --message "chore(tracker): regenerate the tracker"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

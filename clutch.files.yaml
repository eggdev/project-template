# The files that Clutch puts in a project, and how `clutch sync` treats each one.
# The longest matching path decides the rule for a file.
#   managed: sync replaces it. A project edit needs a person's keep-or-take decision.
#   merge:   sync merges the project's copy with Clutch's copy.
#   seed:    install writes it once. Sync never touches it again.
# See apps/cli/README.md#sync.
version: 1
files:
  # Shared tooling and agent setup.
  - path: tools/
    rule: managed
  - path: .agents/skills/
    rule: managed
    capability: skills_dir
  - path: .claude/skills/
    rule: managed
    capability: skills_dir
  - path: .agents/hooks/
    rule: managed
  - path: .githooks/
    rule: managed
    capability: git_hooks
  - path: .github/workflows/
    rule: managed
  # Renovate's config. Managed, so it arrives with renovate.yml and its changeset task.
  - path: renovate.json
    rule: managed
    capability: dep_automation
  - path: .github/actionlint.yaml
    rule: managed
  # The main ruleset. Managed, so a new required check reaches each project.
  # `clutch ruleset --apply` sends it to GitHub. See docs/contributing/capabilities/protected-main.md.
  - path: .github/rulesets/
    rule: managed
    capability: protected_main
  - path: .github/ISSUE_TEMPLATE/
    rule: managed
  - path: .github/pull_request_template.md
    rule: managed
    capability: pr_template
  # Review tooling. `clutch sync --only review` installs only these.
  - path: .agents/skills/README.md
    rule: managed
    group: review
  - path: .agents/skills/deliver/
    rule: managed
    group: review
  - path: .claude/skills/deliver
    rule: managed
    group: review
  - path: .agents/skills/deliver-linear/
    rule: managed
    group: review
  - path: .claude/skills/deliver-linear
    rule: managed
    group: review
  - path: .agents/skills/setup-verification/
    rule: managed
    group: review
  - path: .claude/skills/setup-verification
    rule: managed
    group: review
  - path: .agents/skills/audit-codebase/
    rule: managed
    group: review
  - path: .claude/skills/audit-codebase
    rule: managed
    group: review
  - path: .agents/skills/pr-recap/
    rule: managed
    group: review
  - path: .claude/skills/pr-recap
    rule: managed
    group: review
  - path: tools/verification/
    rule: managed
    group: review
  - path: tools/run-skill-tests.py
    rule: managed
    group: review
  # Shared configuration. A project that customizes one decides at each sync.
  - path: .editorconfig
    rule: managed
  - path: .oxfmtrc.json
    rule: managed
  - path: bunfig.toml
    rule: managed
  - path: tsconfig.base.json
    rule: managed
  - path: oxlint.config.ts
    rule: managed
    capability: custom_lint_plugin
  - path: stylelint.config.ts
    rule: managed
  - path: nx.json
    rule: managed
  - path: knip.jsonc
    rule: managed
  - path: mise.toml
    rule: managed
  - path: .gitleaks.toml
    rule: managed
    capability: secret_scanning
  # Universal docs. Every other docs page belongs to the project.
  - path: docs/principles/
    rule: managed
  - path: docs/contributing/documentation.md
    rule: managed
  - path: docs/contributing/harness-engineering.md
    rule: managed
  - path: docs/contributing/import-boundaries.md
    rule: managed
  - path: docs/
    rule: seed
  # Files that both sides edit.
  - path: package.json
    rule: merge
  - path: .gitignore
    rule: merge
  - path: .gitattributes
    rule: merge
  - path: .claude/settings.json
    rule: merge
  - path: .codex/hooks.json
    rule: merge
  # Files that the project owns after install.
  - path: AGENTS.md
    rule: seed
    capability: root_agents_md
  # Claude Code reads CLAUDE.md. It imports AGENTS.md, so both agents read one file.
  - path: CLAUDE.md
    rule: managed
    capability: root_agents_md
  - path: KICKOFF.md
    rule: seed
  - path: .github/CODEOWNERS
    rule: seed
  - path: SECURITY.md
    rule: seed
    capability: secret_scanning
  # Risk tiers by path. A project tunes the paths to its own layout.
  - path: .clutch/risk.yaml
    rule: seed
  # How a project writes changesets. Clutch's own pending changesets stay here.
  - path: .changeset/README.md
    rule: seed
    capability: codeowners
retired:
  - .agents/skills/audit/
  - .agents/skills/linear-delivery/
  - .agents/skills/verify-repo/
  - .agents/skills/visual-recap/
  - .claude/skills/audit
  - .claude/skills/linear-delivery
  - .claude/skills/verify-repo
  - .claude/skills/visual-recap
exclude:
  # Clutch's test of its own reusable doctor workflow.
  - .github/workflows/clutch-self-test.yml
  # Clutch's own approved false positives, by commit. A project keeps its own.
  - .gitleaksignore
  # Clutch's release history. A project starts its own changelog.
  - CHANGELOG.md
  # Each project generates its own verify skill.
  - .agents/skills/verify/
  - .claude/skills/verify
  # The capability registry belongs to Clutch. Projects read the copy in their Clutch checkout.
  - docs/contributing/capabilities/registry.yaml
# Hashes of older Clutch copies, by path. A project file that matches one is unchanged, so sync may replace it.
